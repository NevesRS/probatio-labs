services:
  attacker:
    build:
      context: ./attacker
      args:
        HINTS_FILE: hints-lab3.md
    container_name: attacker
    tty: true
    stdin_open: true
    cap_add:
      - NET_RAW
      - NET_ADMIN
    ports:
      - "7681:7681"
    networks:
      default: {}
      ot_lab_net3:
        ipv4_address: 172.31.0.10

  target:
    build: ./target-lab3
    container_name: target
    volumes:
      - flag_data_lab3:/flag
    networks:
      ot_lab_net3:
        ipv4_address: 172.31.0.20

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "8080:8080"
    volumes:
      - flag_data:/flags/lab1:ro
      - flag_data_lab2:/flags/lab2:ro
      - flag_data_lab3:/flags/lab3:ro
    networks:
      - default

volumes:
  flag_data:
  flag_data_lab2:
  flag_data_lab3:

networks:
  default:
  ot_lab_net3:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.31.0.0/24
