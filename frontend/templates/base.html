<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Probatio Labs{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="header">
        <a href="/" class="header__logo-link">
            <img src="{{ url_for('static', filename='Icon.png') }}" alt="Probatio Labs" class="header__logo">
        </a>
        <nav class="header__nav">
            <a href="/" class="header__link">Desafios</a>
        </nav>
    </header>

    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Probatio Labs &mdash; Ambiente de treinamento em segurança de sistemas cibernéticos</p>
    </footer>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
