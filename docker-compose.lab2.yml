services:
  attacker:
    build:
      context: ./attacker
      args:
        HINTS_FILE: hints-lab2.md
    container_name: attacker
    tty: true
    stdin_open: true
    cap_add:
      - NET_RAW
      - NET_ADMIN
    ports:
      - "7681:7681"
    networks:
      default: {}
      it_net:
        ipv4_address: 172.29.0.10

  gateway:
    build: ./gateway
    container_name: gateway
    cap_add:
      - NET_RAW
    networks:
      it_net:
        ipv4_address: 172.29.0.2
      ot_net:
        ipv4_address: 172.30.0.2

  target:
    build: ./target
    container_name: target
    volumes:
      - flag_data_lab2:/flag
    networks:
      ot_net:
        ipv4_address: 172.30.0.20

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "8080:8080"
    volumes:
      - flag_data:/flags/lab1:ro
      - flag_data_lab2:/flags/lab2:ro
      - flag_data_lab3:/flags/lab3:ro
    networks:
      - default

volumes:
  flag_data:
  flag_data_lab2:
  flag_data_lab3:

networks:
  default:
  it_net:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.29.0.0/24
  ot_net:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/24
